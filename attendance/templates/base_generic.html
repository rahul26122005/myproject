<!-- base_generic.html -->
 {% load static %}

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=2.0">
  <!-- Bootstrap CSS -->
   {% load static %}

   <link rel="stylesheet" href="{% static 'css/mystyle.css' %}">

  <title>
    {% block title %}

    
    {% endblock %}
  </title>
</head>
<body>
  <nav class="navbar">
  {% block navbar%}



  {% endblock %}
  </nav>

  <div>
    <div class="messages">

      {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      </div>

    {% block content %}



    {% endblock %}
  </div>


<script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
